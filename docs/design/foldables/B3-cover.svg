<text x="424" y="86" font-size="14" font-weight="600" fill="#111111">说明</text>
<circle cx="434" cy="106" r="10" fill="#1F5FD1"/><text x="434" y="110.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="452" y="110" font-size="13" fill="#111111">只做一件事：看相机刚传来的照片；不编辑、</text>
<text x="452" y="132" font-size="13" fill="#111111">不发布</text>
<circle cx="434" cy="150" r="10" fill="#1F5FD1"/><text x="434" y="154.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="452" y="154" font-size="13" fill="#111111">左右划 = 前后翻看最近到达的照片；点 =</text>
<text x="452" y="176" font-size="13" fill="#111111">显示 / 隐藏信息</text>
<circle cx="434" cy="194" r="10" fill="#1F5FD1"/><text x="434" y="198.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="452" y="198" font-size="13" fill="#111111">接收进度和连接状态在左上（实底胶囊）；</text>
<text x="452" y="220" font-size="13" fill="#111111">失败时变成琥珀色并写原因</text>
<circle cx="434" cy="238" r="10" fill="#1F5FD1"/><text x="434" y="242.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="452" y="242" font-size="13" fill="#111111">打开手机 = 在内屏的编辑器里接着看这一</text>
<text x="452" y="264" font-size="13" fill="#111111">张（同一张、同一状态）</text>
<circle cx="434" cy="282" r="10" fill="#1F5FD1"/><text x="434" y="286.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="452" y="286" font-size="13" fill="#111111">应用不能上外屏的机型：靠系统通知里的接</text>
<text x="452" y="308" font-size="13" fill="#111111">收进度，不另做东西</text>
</svg>