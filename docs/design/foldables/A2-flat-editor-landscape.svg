<circle cx="978" cy="106" r="10" fill="#1F5FD1"/><text x="978" y="110.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="996" y="110" font-size="13" fill="#111111">照片占满全宽，可以跨过平放的折痕：横构</text>
<text x="996" y="132" font-size="13" fill="#111111">图在这里比现在的侧窗格大约 2 倍面积</text>
<circle cx="978" cy="150" r="10" fill="#1F5FD1"/><text x="978" y="154.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="996" y="154" font-size="13" fill="#111111">折痕两侧各 16 dp 的禁区（淡红）：没有</text>
<text x="996" y="176" font-size="13" fill="#111111">任何可点的控件，盘面和坞的边缘都离开它</text>
<circle cx="978" cy="194" r="10" fill="#1F5FD1"/><text x="978" y="198.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="996" y="198" font-size="13" fill="#111111">惯用手半屏：页眉 + 强度条 + 盘面，右</text>
<text x="996" y="220" font-size="13" fill="#111111">拇指的舒适区</text>
<circle cx="978" cy="238" r="10" fill="#1F5FD1"/><text x="978" y="242.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="996" y="242" font-size="13" fill="#111111">另一半：分类坞 + 直方图，左拇指选分类，</text>
<text x="996" y="264" font-size="13" fill="#111111">右手不用跨过折痕</text>
<circle cx="978" cy="282" r="10" fill="#1F5FD1"/><text x="978" y="286.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="996" y="286" font-size="13" fill="#111111">顶栏在两个上角，不在折痕上；读数居中在</text>
<text x="996" y="308" font-size="13" fill="#111111">照片上缘（不可点，可以跨折痕）</text>
