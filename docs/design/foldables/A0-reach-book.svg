<circle cx="0.0" cy="499.2" r="7" fill="#1F5FD1"/>
<defs><clipPath id="c9"><rect x="452.0" y="0" width="452.0" height="832"/></clipPath></defs>
<g clip-path="url(#c9)"><circle cx="904" cy="499.2" r="410" fill="rgba(31,95,209,0.10)"/><circle cx="904" cy="499.2" r="280" fill="rgba(31,95,209,0.22)"/></g>
<circle cx="904.0" cy="499.2" r="7" fill="#1F5FD1"/>
<rect x="16.0" y="744.0" width="336.0" height="56.0" rx="28" fill="none" stroke="#5E5E63" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="468.0" y="556.0" width="424.0" height="244.0" rx="24" fill="none" stroke="#5E5E63" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20.0" y="736.0" font-size="12" font-weight="400" fill="#5E5E63" text-anchor="start">坞</text>
<text x="472.0" y="548.0" font-size="12" font-weight="400" fill="#5E5E63" text-anchor="start">盘面 + 强度条</text>
<circle cx="40.0" cy="469.2" r="11" fill="#1F5FD1" stroke="#FFFFFF" stroke-width="2"/>
<text x="40.0" y="473.7" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="452.0" cy="120.0" r="11" fill="#1F5FD1" stroke="#FFFFFF" stroke-width="2"/>
<text x="452.0" y="124.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="784.0" cy="692.0" r="11" fill="#1F5FD1" stroke="#FFFFFF" stroke-width="2"/>
<text x="784.0" y="696.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="300.0" cy="200.0" r="11" fill="#1F5FD1" stroke="#FFFFFF" stroke-width="2"/>
<text x="300.0" y="204.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<circle cx="844.0" cy="619.2" r="11" fill="#1F5FD1" stroke="#FFFFFF" stroke-width="2"/>
<text x="844.0" y="623.7" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
</g>
<text x="968" y="86" font-size="14" font-weight="600" fill="#111111">说明</text>
<circle cx="978" cy="106" r="10" fill="#1F5FD1"/><text x="978" y="110.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="996" y="110" font-size="13" fill="#111111">双手握在两侧偏下（握点约在屏高 60 %），</text>
<text x="996" y="132" font-size="13" fill="#111111">两个拇指各管一个下角</text>
<circle cx="978" cy="150" r="10" fill="#1F5FD1"/><text x="978" y="154.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="996" y="154" font-size="13" fill="#111111">离两个拇指都最远的是正中与上沿：恰好是</text>
<text x="996" y="176" font-size="13" fill="#111111">折痕和顶栏所在；所以折痕上不放控件</text>
<circle cx="978" cy="194" r="10" fill="#1F5FD1"/><text x="978" y="198.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="996" y="198" font-size="13" fill="#111111">“分左右”布局：盘面在惯用手的深蓝区，</text>
<text x="996" y="220" font-size="13" fill="#111111">坞在另一只手的深蓝区</text>
<circle cx="978" cy="238" r="10" fill="#1F5FD1"/><text x="978" y="242.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="996" y="242" font-size="13" fill="#111111">单手托着、另一只手食指点：整屏都够得到，</text>
<text x="996" y="264" font-size="13" fill="#111111">但托的那只手的拇指只管它那一侧边带</text>
<circle cx="978" cy="282" r="10" fill="#1F5FD1"/><text x="978" y="286.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="996" y="286" font-size="13" fill="#111111">手掌和拇指根会挡住拇指下方：所以照片不</text>
<text x="996" y="308" font-size="13" fill="#111111">放在操作手的下方，读数放在照片上缘</text>
</svg>