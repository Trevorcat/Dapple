<svg xmlns="http://www.w3.org/2000/svg" width="1298" height="936" viewBox="0 0 1298 936" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1298" height="936" fill="#FAFAFA"/>
<text x="24" y="32" font-size="20" font-weight="700" fill="#111111">A0 书本式内屏 · 拇指可达（平放，双手握）</text>
<text x="24" y="54" font-size="13" fill="#5E5E63">深蓝 = 舒适（拇指半径约 45 mm ≈ 280 dp），浅蓝 = 伸直可达（约 65 mm ≈ 410 dp）；估计值，待真机测</text>
<g transform="translate(24,72)">
<rect x="-6.0" y="-6.0" width="916.0" height="844.0" rx="22" fill="#FFFFFF" stroke="#C9C9CE" stroke-width="2"/>
<rect x="0.0" y="0.0" width="904.0" height="832.0" rx="14" fill="#F2F2F2"/>
<text x="16.0" y="24.0" font-size="12" font-weight="400" fill="#5E5E63" text-anchor="start">9:41</text>
<rect x="392.0" y="818.0" width="120.0" height="4.0" rx="2" fill="rgba(0,0,0,0.30)"/>
<rect x="436.0" y="0.0" width="32.0" height="832.0" rx="0" fill="rgba(198,40,40,0.06)"/>
<line x1="452.0" y1="0.0" x2="452.0" y2="832.0" stroke="rgba(0,0,0,0.28)" stroke-width="1.5" stroke-dasharray="6 5"/>
